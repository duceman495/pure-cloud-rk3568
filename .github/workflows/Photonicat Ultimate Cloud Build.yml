name: Build Photonicat OpenWrt

on:
  workflow_dispatch: # 允许在 GitHub Actions 页面手动点击触发编译

jobs:
  build:
    # 使用最新的 Ubuntu 享受极速排队和高性能，规避 20.04 的排队地狱
    runs-on: ubuntu-latest 

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Free Disk Space
      uses: jlumbroso/free-disk-space@main
      with:
        tool-cache: true
        android: true
        dotnet: true
        haskell: true
        large-packages: true
        # 必须设为 false，我们需要用到 Docker
        docker-images: false 
        # 必须设为 false！保留 Swap 虚拟内存，防止由于高并发导致 OOM (内存溢出) 被强杀
        swap-storage: false  

    - name: Compile in Ubuntu 20.04 Docker Container
      run: |
        # 启动一个 Ubuntu 20.04 容器，并将 GitHub 的工作目录挂载到容器内的 /workspace
        docker run --rm -v ${{ github.workspace }}:/workspace ubuntu:20.04 /bin/bash -c "
        
        # 1. 更新软件源并安装光影猫官方要求的所有依赖
        apt-get update
        DEBIAN_FRONTEND=noninteractive apt-get install -y sudo build-essential flex bison genext2fs \
            ccache ecj fastjar file g++ gawk gettext git \
            java-propose-classpath libelf-dev libncurses5-dev \
            libncursesw5-dev libssl-dev python2.7-dev python3 \
            unzip wget python3-distutils python3-setuptools python3-dev \
            rsync subversion swig time xsltproc zlib1g-dev \
            device-tree-compiler gcc-aarch64-linux-gnu bc lz4 python python-is-python2
        
        # 2. 创建非 root 用户 (OpenWrt 编译硬性要求)
        useradd -m -s /bin/bash builder
        chown -R builder:builder /workspace
        
        # 3. 切换到 builder 用户并执行官方编译流程
        su - builder -c '
          cd /workspace
          
          # 优化 Git 缓冲区设置，防止拉取超大仓库 (如内核) 时中断
          git config --global http.postBuffer 1048576000
          
          echo \"开始克隆 SDK...\"
          git clone https://github.com/photonicat/rockchip_rk3568_linux_sdk -b openwrt --single-branch rk3568-linux-sdk
          cd rk3568-linux-sdk
          
          # 如果你在云端也遇到 GitHub 抽风拉取失败，可以取消下面这行的注释开启镜像加速
          # git config --global url.\"https://ghfast.top/https://github.com/\".insteadOf \"https://github.com/\"
          
          echo \"初始化子模块...\"
          git submodule update --init --depth 1
          
          echo \"加载光影猫 OpenWrt 配置...\"
          ./rk3568-config-photonicat-openwrt.sh
          
          echo \"开始执行全自动编译...\"
          export CROSS_COMPILE=aarch64-linux-gnu-
          ./build.sh
        '
        "

    - name: Upload Firmware Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: photonicat-openwrt-firmware
        # 提取 rockdev/pack 目录下生成的最终镜像文件
        path: ${{ github.workspace }}/rk3568-linux-sdk/rockdev/pack/*.img
