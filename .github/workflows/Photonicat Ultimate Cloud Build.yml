name: Build Official Photonicat SDK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest # 使用最新机器排队最快

    steps:
    - name: Maximize Build Space & Add Swap
      uses: easimon/maximize-build-space@master
      with:
        # 核心黑科技：分配 4GB 虚拟内存防止编译内核时 OOM 猝死
        swap-size-mb: 4096
        # 卸载所有无用组件
        remove-dotnet: 'true'
        remove-android: 'true'
        remove-haskell: 'true'
        remove-codeql: 'true'
        remove-docker-images: 'true'

    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Compile in pure Ubuntu 20.04 Container
      run: |
        # 启动 Ubuntu 20.04 容器，避开 22.04 的 OpenSSL 3.0 致命报错
        docker run --rm -v ${{ github.workspace }}:/workspace ubuntu:20.04 /bin/bash -c "
        
        # 1. 替换国内镜像源加速 apt，并安装官方依赖
        sed -i 's/archive.ubuntu.com/mirrors.aliyun.com/g' /etc/apt/sources.list
        apt-get update
        DEBIAN_FRONTEND=noninteractive apt-get install -y sudo build-essential flex bison genext2fs \
            ccache ecj fastjar file g++ gawk gettext git \
            java-propose-classpath libelf-dev libncurses5-dev \
            libncursesw5-dev libssl-dev python2.7-dev python3 \
            unzip wget python3-distutils python3-setuptools python3-dev \
            rsync subversion swig time xsltproc zlib1g-dev \
            device-tree-compiler gcc-aarch64-linux-gnu bc lz4 python python-is-python2
        
        # 2. 建立非 root 用户满足 OpenWrt 编译限制
        useradd -m -s /bin/bash builder
        chown -R builder:builder /workspace
        
        # 3. 执行官方全量编译，并强制输出日志
        su - builder -c '
          cd /workspace
          git config --global http.postBuffer 1048576000
          
          echo \"[1/4] 克隆光影猫 SDK...\"
          # 使用 ghfast 镜像加速克隆，防止因仓库过大导致网络中断
          git clone https://ghfast.top/https://github.com/photonicat/rockchip_rk3568_linux_sdk -b openwrt --single-branch rk3568-linux-sdk
          cd rk3568-linux-sdk
          
          echo \"[2/4] 初始化子模块...\"
          # 同样为子模块配置加速代理
          git config --global url.\"https://ghfast.top/https://github.com/\".insteadOf \"https://github.com/\"
          git submodule update --init --depth 1
          
          echo \"[3/4] 载入设备配置...\"
          ./rk3568-config-photonicat-openwrt.sh
          
          echo \"[4/4] 启动全量编译 (这会持续1-2小时，请耐心等待)...\"
          export CROSS_COMPILE=aarch64-linux-gnu-
          # 将终端输出同时保存到文件，留下完整的黑匣子记录
          ./build.sh 2>&1 | tee /workspace/full_build.log
        '
        "

    - name: Upload Firmware Artifacts
      if: success()
      uses: actions/upload-artifact@v4
      with:
        name: photonicat-firmware
        path: ${{ github.workspace }}/rk3568-linux-sdk/rockdev/pack/*.img

    - name: Upload Build Log (On Failure)
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: build-crash-log
        path: ${{ github.workspace }}/full_build.log
